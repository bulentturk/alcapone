name: Generate engineering Short

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video başlığı
        required: true
        default: Yeraltı Madenlerinde Otonom Makineler
        type: string
      script:
        description: Türkçe seslendirme metni
        required: true
        default: >-
          Yeraltı madenlerinde otonom makineler yalnızca operatörü kabinden
          çıkarmıyor. Aynı zamanda çevrim süresini daha tutarlı hale getiriyor,
          üretim verisini sürekli topluyor ve riskli bölgelerde insan maruziyetini
          azaltıyor. Asıl dönüşüm ise makinenin kendisinden çok; haberleşme,
          emniyet ve filo yönetimi katmanlarının birlikte çalışmasında yaşanıyor.
        type: string
      source_url:
        description: Açıklamaya eklenecek kaynak bağlantısı
        required: false
        default: https://www.algo-team.com
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHORT_TITLE: ${{ inputs.title }}
      SHORT_SCRIPT: ${{ inputs.script }}
      SHORT_SOURCE_URL: ${{ inputs.source_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Generate Short
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python src/generate_short.py \
            --title "$SHORT_TITLE" \
            --script "$SHORT_SCRIPT" \
            --source-url "$SHORT_SOURCE_URL" \
            --output-dir output

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: algo-team-engineering-short-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14

